<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunlight Sober Living Foundation</title>
    <meta name="description" content="Sunlight Sober Living Foundation illuminates the path forward through faith-based recovery support, holistic healing, and community connection." />
    <meta name="author" content="Sunlight Sober Living Foundation" />
    <meta property="og:title" content="Sunlight Sober Living Foundation" />
    <meta property="og:description" content="Illuminating the path forward through recovery support, holistic healing, and peaceful human connection." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sunlight-foundation.org/" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="module" crossorigin src="/assets/index-BUcskFN9.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-LwtT0N5F.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const missionStatement = 'We believe recovery should be seen, supported, and celebrated. Through compassion, community partnerships, and practical support, Sunlight Sober Living Foundation works alongside people in recovery, peer support specialists, families, and local leaders to challenge stigma and help more people find their way forward.';
        const contactEmail = 'info@sunlightrecovery.org';

        const normalize = (text) => (text || '').replace(/\s+/g, ' ').trim();
        const findByText = (selector, text) => Array.from(document.querySelectorAll(selector))
          .find((element) => normalize(element.textContent) === text);
        const findSectionByHeading = (headingText) => {
          const heading = findByText('h1, h2, h3, h4', headingText);
          if (!heading) return null;
          return heading.closest('section') || heading.closest('footer') || heading.closest('div');
        };
        const scrollToTarget = (target) => {
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };
        const wireClick = (element, handler) => {
          if (!element || element.dataset.sunlightWired === 'true') return;
          element.dataset.sunlightWired = 'true';
          element.setAttribute('role', element.tagName === 'A' ? 'link' : 'button');
          element.addEventListener('click', (event) => {
            event.preventDefault();
            handler();
          });
        };
        const mailTo = (subject) => {
          window.location.href = `mailto:${contactEmail}?subject=${encodeURIComponent(subject)}`;
        };
        const enhancePage = () => {
          const missionSection = findSectionByHeading('Rooted in Faith, Guided by Compassion');
          const programsSection = findSectionByHeading('Pillars of Support');
          const leadershipSection = findSectionByHeading('Transparency & Leadership');
          const footer = document.querySelector('footer') || findSectionByHeading('Stay Connected');

          if (missionSection && !document.querySelector('[data-sunlight-mission-statement]')) {
            const missionParagraph = Array.from(missionSection.querySelectorAll('p'))
              .find((paragraph) => normalize(paragraph.textContent).startsWith('Rooted in faith'));
            if (missionParagraph) {
              const paragraph = document.createElement('p');
              paragraph.dataset.sunlightMissionStatement = 'true';
              paragraph.className = missionParagraph.className;
              paragraph.style.marginTop = '1.25rem';
              paragraph.textContent = missionStatement;
              missionParagraph.insertAdjacentElement('afterend', paragraph);
            }
          }

          Array.from(document.querySelectorAll('a, button')).forEach((element) => {
            const label = normalize(element.textContent);
            if (label === 'SunlightSLF') wireClick(element, () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            if (label === 'Mission' || label === 'Our Mission') wireClick(element, () => scrollToTarget(missionSection));
            if (label === 'Programs') wireClick(element, () => scrollToTarget(programsSection));
            if (label === 'Leadership') wireClick(element, () => scrollToTarget(leadershipSection));
            if (label === 'Get Involved' || label === 'Contact' || label === 'Contact Us') wireClick(element, () => scrollToTarget(footer));
            if (label === 'Donate') wireClick(element, () => mailTo('Donation for Sunlight Sober Living Foundation'));
            if (label === 'Subscribe') wireClick(element, () => mailTo('Subscribe me to Sunlight Foundation updates'));
            if (label.includes(contactEmail)) {
              element.setAttribute('href', `mailto:${contactEmail}`);
            }
          });
        };

        enhancePage();
        new MutationObserver(enhancePage).observe(document.getElementById('root'), {
          childList: true,
          subtree: true,
        });
      });
    </script>
  </body>
</html>
